<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>

    <style>
        body{
            text-align:center;
            font-family:Arial;
        }

        .board{
            width:306px;
            margin:auto;
            display:grid;
            grid-template-columns:repeat(3,100px);
            gap:3px;
        }

        .cell{
            width:100px;
            height:100px;
            border:1px solid black;
            font-size:40px;
            display:flex;
            justify-content:center;
            align-items:center;
            cursor:pointer;
        }

        button{
            margin-top:20px;
            padding:10px 20px;
        }
    </style>
</head>
<body>

    <h1>Tic Tac Toe</h1>

    <h2 id="status">Player X Turn</h2>

    <div class="board">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>

        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

    <button id="restart">Reset</button>

    <script src="tictactoe.js"></script>
</body>
</html>
