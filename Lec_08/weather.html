<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: linear-gradient(135deg,#4facfe,#00f2fe);
    }

    .weather-box{
      width:320px;
      background:white;
      padding:25px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 10px 20px rgba(0,0,0,0.2);
    }

    h1{
      margin-bottom:20px;
      color:#333;
    }

    input{
      width:100%;
      padding:12px;
      border:2px solid #ddd;
      border-radius:10px;
      outline:none;
      margin-bottom:15px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#4facfe;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#0099ff;
    }

    .result{
      margin-top:20px;
    }

    .temp{
      font-size:40px;
      font-weight:bold;
      color:#333;
    }

    .city{
      font-size:22px;
      margin-top:10px;
      color:#666;
    }
  </style>
</head>
<body>

  <div class="weather-box">
    <h1>Weather App</h1>

    <input type="text" id="city" placeholder="Enter city name">

    <button onclick="getWeather()">Search</button>

    <div class="result">
      <div class="temp" id="temp">--°C</div>
      <div class="city" id="cityName">City Name</div>
    </div>
  </div>

  <script src="weather.js"></script>
</body>
</html>
