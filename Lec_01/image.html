<!DOCTYPE html>
<html>
<head>
<title>Image Flip Animation</title>
<style>
.flip-box {
    width: 300px;
    height: 200px;
    perspective: 1000px;
}

.flip-box-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s;
}

.flip-box:hover .flip-box-inner {
    transform: rotateY(180deg);
}

.flip-box-front, .flip-box-back {
    width: 100%;
    height: 100%;
    position: absolute;
    backface-visibility: hidden;
}

.flip-box-front img,
.flip-box-back img {
    width: 100%;
    height: 100%;
}

.flip-box-back {
    transform: rotateY(180deg);
}
</style>
</head>

<body>

<div class="flip-box">
    <div class="flip-box-inner">
        <div class="flip-box-front">
            <img src="pexels-christine-faustino-2158795626-35602757 (1).jpg">
        </div>
        <div class="flip-box-back">
            <img src="pexels-wang-jun-2142607661-31775562.jpg">
        </div>
    </div>
</div>

</body>
</html>
