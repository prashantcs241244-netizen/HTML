<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Snake Snack Game</title>
<style>
  body {
    margin: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
  }

  canvas {
    background: black;
    border: 10px solid #00ffff;
  }
</style>
</head>
<body>

<canvas id="game" width="500" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const gridSize = 20;
let snake = [{ x: 240, y: 240 }];
let dx = gridSize;
let dy = 0;
let score = 0;

let apple = generateApple();

function generateApple() {
  return {
    x: Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize,
    y: Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize
  };
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" && dy === 0) {
    dx = 0; dy = -gridSize;
  }
  if (e.key === "ArrowDown" && dy === 0) {
    dx = 0; dy = gridSize;
  }
  if (e.key === "ArrowLeft" && dx === 0) {
    dx = -gridSize; dy = 0;
  }
  if (e.key === "ArrowRight" && dx === 0) {
    dx = gridSize; dy = 0;
  }
});

function drawSnake() {
  ctx.fillStyle = "lime";
  snake.forEach(part => {
    ctx.beginPath();
    ctx.arc(part.x + gridSize/2, part.y + gridSize/2, gridSize/2, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawApple() {
  // Apple body
  ctx.fillStyle = "red";
  ctx.beginPath();
  ctx.arc(apple.x + gridSize/2, apple.y + gridSize/2, gridSize/2, 0, Math.PI * 2);
  ctx.fill();

  // Apple stem
  ctx.strokeStyle = "brown";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(apple.x + gridSize/2, apple.y + 5);
  ctx.lineTo(apple.x + gridSize/2, apple.y - 5);
  ctx.stroke();
}

function drawScore() {
  ctx.fillStyle = "white";
  ctx.font = "18px Arial";
  ctx.fillText("Score: " + score, 10, 25);
}

function update() {
  const head = {
    x: snake[0].x + dx,
    y: snake[0].y + dy
  };

  // Game over conditions
  if (
    head.x < 0 || head.y < 0 ||
    head.x >= canvas.width || head.y >= canvas.height ||
    snake.some(part => part.x === head.x && part.y === head.y)
  ) {
    alert("Game Over! Score: " + score);
    snake = [{ x: 240, y: 240 }];
    dx = gridSize;
    dy = 0;
    score = 0;
    apple = generateApple();
    return;
  }

  snake.unshift(head);

  // Eat apple
  if (head.x === apple.x && head.y === apple.y) {
    score++;
    apple = generateApple();
  } else {
    snake.pop();
  }
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  update();
  drawApple();
  drawSnake();
  drawScore();
}

setInterval(gameLoop, 100);
</script>

</body>
</html>
