<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Grid Box</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            padding: 2px;
        }

        .grid-item {
            background-color: #09eff7;
            color: white;
            padding: 100px;
            text-align: center;
            font-size: 30px;
            border-radius: 0px;
        }
    </style>
</head>
<body>

    <h2 style="text-align:center;">..........Grid Box.......... </h2>

    <div class="grid-container">
        <div class="grid-item">Box 1</div>
        <div class="grid-item">Box 2</div>
        <div class="grid-item">Box 3</div>
        <div class="grid-item">Box 4</div>
        <div class="grid-item">Box 5</div>
        <div class="grid-item">Box 6</div>
    </div>

</body>
</html>
